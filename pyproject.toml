[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "floatchat"
version = "0.1.0"
description = "FloatChat AI-powered Ocean Intelligence Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.0",
    "httpx>=0.27.0",
    "motor>=3.3.0",
    "pymongo>=4.6.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "openai>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai*", "data*", "backend*"]