<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <radialGradient id="sonarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="#0A1628" stroke="url(#oceanGrad)" stroke-width="2.5"/>
  
  <!-- Radar/Sonar Ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#00E5FF" stroke-opacity="0.25" stroke-dasharray="3 3"/>
  <circle cx="50" cy="50" r="20" fill="none" stroke="#00E5FF" stroke-opacity="0.4"/>
  
  <!-- Wave / Float Sonar Waves -->
  <path d="M22 62C28 58 36 66 44 62C52 58 60 66 68 62C74 59 78 61 80 62" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M20 70C27 66 35 74 43 70C51 66 59 74 67 70C73 67 77 69 80 70" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- ARGO Float Geometry in Center -->
  <!-- Float Antenna -->
  <line x1="50" y1="18" x2="50" y2="30" stroke="#00E5FF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="18" r="2.5" fill="#38BDF8"/>
  <circle cx="50" cy="18" r="5" fill="none" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Float Cylinder Body -->
  <rect x="44" y="30" width="12" height="24" rx="4" fill="url(#oceanGrad)" stroke="#E0F2FE" stroke-width="1.2"/>
  
  <!-- Float Lower Cone / Sensor -->
  <polygon points="45,54 55,54 50,60" fill="#0284C7"/>
  
  <!-- Core Telemetry Pulse Dot -->
  <circle cx="50" cy="42" r="2" fill="#FFFFFF"/>
</svg>
