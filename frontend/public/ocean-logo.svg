<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="fc-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="fc-violet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="fc-hull-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="fc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Depth Glow Background -->
  <circle cx="50" cy="50" r="46" fill="#040d21" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1.5" />

  <!-- Orbital Signal Waves (Acoustic / Satellite telemetry) -->
  <path d="M 22 34 A 32 32 0 0 1 78 34" stroke="url(#fc-cyan-grad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
  <path d="M 28 26 A 40 40 0 0 1 72 26" stroke="url(#fc-violet-grad)" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.4" />

  <!-- Ocean Wave Surface Geometry -->
  <path d="M 12 56 Q 30 50, 50 56 T 88 56" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5" fill="none" />
  <path d="M 16 64 Q 35 58, 50 64 T 84 64" stroke="rgba(139, 92, 246, 0.25)" stroke-width="1.5" fill="none" />

  <!-- Argo Profiling Float Instrument Body -->
  <!-- Antenna & Telemetry Beacon -->
  <line x1="50" y1="14" x2="50" y2="30" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="50" cy="14" r="3" fill="#00f2fe" filter="url(#fc-glow)" />

  <!-- Float Collar / Floatation Ring -->
  <rect x="42" y="30" width="16" height="5" rx="2.5" fill="#38bdf8" />

  <!-- Streamlined CTD Hull Pressure Case -->
  <path d="M 44 35 L 56 35 L 54 74 Q 50 82, 46 74 Z" fill="url(#fc-hull-grad)" stroke="#38bdf8" stroke-width="1" />

  <!-- Internal Sensor CTD Grid Lines -->
  <line x1="45" y1="44" x2="55" y2="44" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1" />
  <line x1="46" y1="53" x2="54" y2="53" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1" />
  <line x1="47" y1="62" x2="53" y2="62" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1" />

  <!-- Bottom Acoustic Pinger / Sensor Port -->
  <circle cx="50" cy="79" r="2" fill="#00f2fe" filter="url(#fc-glow)" />

  <!-- Pulsing Transmission Signal Orbits -->
  <circle cx="50" cy="14" r="7" stroke="#00f2fe" stroke-width="1" stroke-dasharray="2 2" opacity="0.75" />
</svg>
